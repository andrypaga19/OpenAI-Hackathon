<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioMatch – Startup CV mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F5F4}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a{color:#0D6B5E}a:hover{color:#09493F}
#switcher{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;background:#12201E;font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;font-size:14px}
#switcher span{color:#D2DCDA;margin-right:8px}
#switcher button{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #3B4B48;background:transparent;color:#FFFFFF;cursor:pointer}
#switcher button[aria-pressed="true"]{background:#FFFFFF;color:#12201E;border-color:#FFFFFF;font-weight:600}
</style>
</head>
<body>
<nav id="switcher" aria-label="Mockup screens"><span>BioMatch mockup · demo data, fictional companies</span><button type="button" data-screen="Onboarding">1 · Stage and template</button><button type="button" data-screen="Main">2 · Startup CV builder</button><button type="button" data-screen="Deck">3 · Pitch deck scan</button><button type="button" data-screen="Preview">4 · What investors see</button></nav>
<div id="app"></div>
<template id="tpl-Onboarding"><div style="min-height: 100vh; background: #F3F5F4; color: #12201E; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; line-height: 1.5;">

<header style="background: #FFFFFF; border-bottom: 1px solid #D9E1DF;">
<div style="max-width: 1280px; margin: 0 auto; padding: 12px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px; min-height: 68px;">
<a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #12201E;">
<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="11.5" cy="15" r="8.5" fill="none" stroke="{{accent}}" stroke-width="2.6"></circle><circle cx="18.5" cy="15" r="8.5" fill="none" stroke="#12201E" stroke-width="2.6"></circle></svg>
<span style="font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 21px; letter-spacing: -0.01em;">BioMatch</span>
</a>
<ol aria-label="Setup steps" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px;">
<li style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #12201E; color: #FFFFFF; font-weight: 600;">1 Stage and template</li>
<li style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C9D3D0; color: #33433F;">2 Startup CV</li>
<li style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C9D3D0; color: #33433F;">3 Pitch deck</li>
</ol>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 28px;">
<div style="display: flex; flex-direction: column; gap: 10px; max-width: 760px;">
<p style="margin: 0; font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #52615E;">Step 1 of 3</p>
<h1 style="margin: 0; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 36px; line-height: 1.12; letter-spacing: -0.02em; text-wrap: balance;">Tell us where you are. We pick the questions investors ask at your stage.</h1>
<p style="margin: 0; color: #33433F; text-wrap: pretty;">Your development stage selects the template, so a discovery-stage spin-out is never scored on data it cannot have yet. Your modality adds a short module of its own.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start;">

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px;">

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px;">
<legend style="padding: 0; margin-bottom: 12px; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 20px; font-weight: 600;">How far is your lead program?</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 10px;">
<sc-for list="{{trls}}" as="t" hint-placeholder-count="6">
<sc-if value="{{t.selected}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" onClick="{{t.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 96px; padding: 14px 16px; border-radius: 12px; border: 2px solid {{accent}}; background: #E1F0EC; text-align: left; cursor: pointer;">
<span style="display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 8px;"><span style="font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 17px; font-weight: 600; color: #0B2F2A;">{{t.trl}}</span><span style="padding: 2px 8px; border-radius: 999px; background: #12201E; color: #FFFFFF; font-size: 12px; font-weight: 500;">{{t.band}}</span></span>
<span style="font-size: 14px; color: #12201E;">{{t.text}}</span>
</button>
</sc-if>
<sc-if value="{{t.unselected}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" onClick="{{t.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 96px; padding: 14px 16px; border-radius: 12px; border: 1px solid #C9D3D0; background: #FFFFFF; text-align: left; cursor: pointer;">
<span style="display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 8px;"><span style="font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 17px; font-weight: 600;">{{t.trl}}</span><span style="padding: 2px 8px; border-radius: 999px; background: #EEF2F1; color: #33433F; font-size: 12px; font-weight: 500;">{{t.band}}</span></span>
<span style="font-size: 14px; color: #33433F;">{{t.text}}</span>
</button>
</sc-if>
</sc-for>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px;">
<legend style="padding: 0; margin-bottom: 4px; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 20px; font-weight: 600;">Which modalities do you work with?</legend>
<p style="margin: 0 0 4px; font-size: 14px; color: #52615E;">Each modality with a module adds three or four questions. Vaccines, radiopharmaceuticals and microbiome use the core questions only.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{mods}}" as="m" hint-placeholder-count="12">
<sc-if value="{{m.selected}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" onClick="{{m.toggle}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 2px solid {{accent}}; background: #E1F0EC; color: #0B2F2A; font-weight: 500; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><polyline points="3.5,8.5 6.5,11.5 12.5,4.5" fill="none" stroke="#0B4F46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>{{m.label}}</button>
</sc-if>
<sc-if value="{{m.unselected}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" onClick="{{m.toggle}}" style="display: flex; align-items: center; min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid #C9D3D0; background: #FFFFFF; cursor: pointer;">{{m.label}}</button>
</sc-if>
</sc-for>
</div>
</fieldset>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 28px;">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px;">
<legend style="padding: 0; margin-bottom: 12px; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 20px; font-weight: 600;">What kind of company are you?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{types}}" as="c" hint-placeholder-count="3">
<sc-if value="{{c.selected}}" hint-placeholder-val="{{false}}"><button type="button" aria-pressed="true" onClick="{{c.pick}}" style="min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 2px solid {{accent}}; background: #E1F0EC; color: #0B2F2A; font-weight: 500; cursor: pointer;">{{c.label}}</button></sc-if>
<sc-if value="{{c.unselected}}" hint-placeholder-val="{{true}}"><button type="button" aria-pressed="false" onClick="{{c.pick}}" style="min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid #C9D3D0; background: #FFFFFF; cursor: pointer;">{{c.label}}</button></sc-if>
</sc-for>
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px;">
<legend style="padding: 0; margin-bottom: 12px; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 20px; font-weight: 600;">Which round are you raising?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{rounds}}" as="r" hint-placeholder-count="6">
<sc-if value="{{r.selected}}" hint-placeholder-val="{{false}}"><button type="button" aria-pressed="true" onClick="{{r.pick}}" style="min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 2px solid {{accent}}; background: #E1F0EC; color: #0B2F2A; font-weight: 500; cursor: pointer;">{{r.label}}</button></sc-if>
<sc-if value="{{r.unselected}}" hint-placeholder-val="{{true}}"><button type="button" aria-pressed="false" onClick="{{r.pick}}" style="min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid #C9D3D0; background: #FFFFFF; cursor: pointer;">{{r.label}}</button></sc-if>
</sc-for>
</div>
</fieldset>
</div>
</div>

<aside aria-labelledby="template-title" style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #D9E1DF; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<p style="margin: 0; font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #52615E;">Your template</p>
<h2 id="template-title" style="margin: 0; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.01em;">{{bandTitle}}</h2>
<p style="margin: 0; font-size: 14px; color: #33433F;">{{bandTrl}}</p>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<div style="padding: 12px; border-radius: 10px; background: #F3F5F4; display: flex; flex-direction: column-reverse; gap: 2px;"><dt style="font-size: 12px; color: #52615E;">Scored questions</dt><dd style="margin: 0; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 28px; font-weight: 700;">{{scored}}</dd></div>
<div style="padding: 12px; border-radius: 10px; background: #F3F5F4; display: flex; flex-direction: column-reverse; gap: 2px;"><dt style="font-size: 12px; color: #52615E;">Required</dt><dd style="margin: 0; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 28px; font-weight: 700;">{{required}}</dd></div>
<div style="padding: 12px; border-radius: 10px; background: #F3F5F4; display: flex; flex-direction: column-reverse; gap: 2px;"><dt style="font-size: 12px; color: #52615E;">Optional bonus</dt><dd style="margin: 0; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 28px; font-weight: 700;">{{optional}}</dd></div>
<div style="padding: 12px; border-radius: 10px; background: #F3F5F4; display: flex; flex-direction: column-reverse; gap: 2px;"><dt style="font-size: 12px; color: #52615E;">About</dt><dd style="margin: 0; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 28px; font-weight: 700;">{{minutes}}</dd></div>
</dl>
<div style="display: flex; flex-direction: column; gap: 8px;">
<h3 style="margin: 0; font-size: 14px; font-weight: 600;">Modules</h3>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{modules}}" as="md" hint-placeholder-count="1"><span style="padding: 4px 10px; border-radius: 999px; background: #E1F0EC; color: #0B4F46; font-size: 13px; font-weight: 500;">{{md.label}}</span></sc-for>
<sc-if value="{{noModules}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: #52615E;">Core questions only</span></sc-if>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<h3 style="margin: 0; font-size: 14px; font-weight: 600;">Weighs most at this stage</h3>
<p style="margin: 0; font-size: 14px; color: #33433F;">{{topWeights}}</p>
<sc-if value="{{cgt}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 13px; color: #33433F;">Cell and gene therapy: 5 points move from Science to CMC.</p></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<h3 style="margin: 0; font-size: 14px; font-weight: 600;">What investors expect at this stage</h3>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #33433F;">
<sc-for list="{{expect}}" as="e" hint-placeholder-count="3"><li>{{e.text}}</li></sc-for>
</ul>
</div>
<sc-if value="{{unusualRound}}" hint-placeholder-val="{{false}}">
<div style="padding: 12px 14px; border-radius: 10px; background: #FCF1DF; display: flex; gap: 10px; align-items: flex-start;">
<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" style="flex: 0 0 auto;"><circle cx="10" cy="10" r="8.5" fill="#FCF1DF" stroke="#A15C07" stroke-width="1.5"></circle><line x1="10" y1="5.5" x2="10" y2="11" stroke="#A15C07" stroke-width="2" stroke-linecap="round"></line><circle cx="10" cy="14" r="1.2" fill="#A15C07"></circle></svg>
<p style="margin: 0; font-size: 13px; color: #5C3A00;">{{roundWarning}}</p>
</div>
</sc-if>
<p style="margin: 0; padding-top: 4px; border-top: 1px solid #E3E9E7; font-size: 13px; color: #52615E;">You are listed at 60/100 once every required question is answered. Progress saves as you go.</p>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-weight: 600; text-decoration: none;">Start the Startup CV</a>
</aside>
</div>
</main>
</div></template>
<template id="tpl-Main"><div style="min-height: 100vh; background: #F3F5F4; color: #12201E; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; line-height: 1.5;">

<header style="background: #FFFFFF; border-bottom: 1px solid #D9E1DF;">
<div style="max-width: 1440px; margin: 0 auto; padding: 12px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px;">
<a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #12201E;">
<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="11.5" cy="15" r="8.5" fill="none" stroke="{{accent}}" stroke-width="2.6"></circle><circle cx="18.5" cy="15" r="8.5" fill="none" stroke="#12201E" stroke-width="2.6"></circle></svg>
<span style="font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 21px; letter-spacing: -0.01em;">BioMatch</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto;">
<a href="#" aria-current="page" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 8px; background: #E1F0EC; color: #0B4F46; font-weight: 600; text-decoration: none;">Startup CV</a>
<a href="Preview.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 8px; color: #33433F; text-decoration: none;">Investor view</a>
<a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 8px; color: #33433F; text-decoration: none;">Matches</a>
<a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 8px; color: #33433F; text-decoration: none;">Intro requests</a>
</nav>
<div style="display: flex; align-items: center; gap: 12px;">
<span style="font-size: 14px; color: #52615E;">Nuvaris Therapeutics</span>
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #12201E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px;">NT</span>
</div>
</div>
</header>

<main style="max-width: 1440px; margin: 0 auto; padding: 28px 32px 64px; display: flex; flex-direction: column; gap: 24px;">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px;">
<div style="display: flex; flex-direction: column; gap: 10px; flex: 1 1 520px; min-width: 0;">
<p style="margin: 0; font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #52615E;">Startup CV · Nuvaris Therapeutics</p>
<h1 style="margin: 0; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 34px; line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance;">Build the profile investors read before any NDA</h1>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<span style="padding: 4px 10px; border-radius: 999px; background: #12201E; color: #FFFFFF; font-size: 13px; font-weight: 500;">D2 · Lead and candidate · TRL 4</span>
<span style="padding: 4px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C9D3D0; font-size: 13px;">Small-molecule module</span>
<span style="padding: 4px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C9D3D0; font-size: 13px;">Seed · raising €8–10M</span>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 220px;">
<span style="font-size: 13px; color: #33433F;">{{answeredText}}</span>
<div style="height: 6px; border-radius: 3px; background: #DDE4E2; overflow: hidden;"><div style="height: 6px; border-radius: 3px; width: {{progressPct}}%; background: {{accent}};"></div></div>
</div>
<a href="Onboarding.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #C9D3D0; background: #FFFFFF; color: #12201E; font-weight: 500; text-decoration: none;">Change stage</a>
<a href="Preview.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-weight: 600; text-decoration: none;">Preview as investor</a>
</div>
</div>

<div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: #FFFFFF; border: 1px solid #D9E1DF; border-radius: 12px;">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px;"><path d="M12 3 L19 6 V11.5 C19 16 16 19.2 12 21 C8 19.2 5 16 5 11.5 V6 Z" fill="none" stroke="#0D6B5E" stroke-width="1.8" stroke-linejoin="round"></path><polyline points="8.8,12 11,14.2 15.4,9.6" fill="none" stroke="#0D6B5E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
<p style="margin: 0; color: #33433F;"><strong style="color: #12201E;">Non-confidential by design.</strong> Verified investors can read everything you enter here without an NDA. Say what your science does, never how – no structures, sequences or unpublished data.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">

<nav aria-label="CV sections" style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<p style="margin: 0 0 2px; font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #52615E;">Setup</p>
<a href="Onboarding.dc.html" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; padding: 10px 12px; border: 1px solid #D9E1DF; border-radius: 10px; background: #FFFFFF; color: #12201E; text-decoration: none;"><span>Stage and template</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><polyline points="3.5,8.5 6.5,11.5 12.5,4.5" fill="none" stroke="#0D6B5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline></svg></a>
<a href="#" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; padding: 10px 12px; border: 1px solid #D9E1DF; border-radius: 10px; background: #FFFFFF; color: #12201E; text-decoration: none;"><span>Company profile</span><span style="font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 12px; color: #33433F;">18/18</span></a>
<a href="Deck.dc.html" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; padding: 10px 12px; border: 1px solid #D9E1DF; border-radius: 10px; background: #FFFFFF; color: #12201E; text-decoration: none;"><span>Pitch deck</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><polyline points="3.5,8.5 6.5,11.5 12.5,4.5" fill="none" stroke="#0D6B5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<p style="margin: 0 0 2px; font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #52615E;">Scored sections</p>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="9">
<sc-if value="{{n.active}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{n.go}}" aria-current="true" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 10px 12px; border: 2px solid {{accent}}; border-radius: 10px; background: #E1F0EC; text-align: left; cursor: pointer;">
